name: SSQ V4-RC2 freeze acceptance

on:
  push:
    branches:
      - ssq-v4-ppas12-20261124
    paths:
      - 'artifacts/v4_rc2_source_b64/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-test-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ssq-v4-ppas12-20261124
          fetch-depth: 0

      - name: Restore exact validated RC2 source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/v4_rc2_source_b64/chunk_06.txt || {
            echo "Bundle incomplete; no-op until all chunks exist."
            exit 0
          }
          cat artifacts/v4_rc2_source_b64/chunk_*.txt > /tmp/ssq_v4_rc2_source.b64
          base64 -d /tmp/ssq_v4_rc2_source.b64 > /tmp/ssq_v4_rc2_source.tar.gz
          echo "363c53aa713ba7119aec9833bad2ba250e97217247cb5fe969de82bcd6eccb03  /tmp/ssq_v4_rc2_source.tar.gz" | sha256sum -c -
          rm -rf v4_rc2
          mkdir -p v4_rc2
          tar -xzf /tmp/ssq_v4_rc2_source.tar.gz --strip-components=1 -C v4_rc2
          python -m py_compile v4_rc2/*.py

      - name: Run 51 regression and real-integration tests
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f artifacts/v4_rc2_source_b64/chunk_06.txt ]; then exit 0; fi
          cd v4_rc2
          python -m unittest test_v4_regression.py test_v4_real_integration.py -v | tee ../V4_RC2_TESTS.log

      - name: Run 100k distribution audit and 1,107,568 brute-force crosscheck
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f artifacts/v4_rc2_source_b64/chunk_06.txt ]; then exit 0; fi
          cd v4_rc2
          python audit_v4_100k.py | tee ../V4_RC2_100K_AUDIT.json

      - name: Freeze tested source into branch
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f artifacts/v4_rc2_source_b64/chunk_06.txt ]; then exit 0; fi
          git config user.name "ssq-v4-freeze-bot"
          git config user.email "ssq-v4-freeze-bot@users.noreply.github.com"
          git add v4_rc2 V4_RC2_TESTS.log V4_RC2_100K_AUDIT.json
          git rm -r artifacts/v4_rc2_source_b64
          if git diff --cached --quiet; then
            echo "No freeze changes."
            exit 0
          fi
          git commit -m "V4-RC2: freeze 51-pass production candidate"
          git push origin HEAD:ssq-v4-ppas12-20261124
