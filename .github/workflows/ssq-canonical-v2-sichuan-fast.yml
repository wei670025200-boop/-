name: SSQ Canonical V2 Sichuan fast audit50
on:
  push:
    branches: [ssq-v5-shadow-integration-20261124]
    paths:
      - 'ssq_v5/data_tools/fetch_sichuan_audit50_fast.py'
      - '.github/workflows/ssq-canonical-v2-sichuan-fast.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install requests beautifulsoup4
      - run: python ssq_v5/data_tools/fetch_sichuan_audit50_fast.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssq-canonical-v2-sichuan-fast50
          path: canonical_v2_sichuan_fast/
          if-no-files-found: error
          retention-days: 30
