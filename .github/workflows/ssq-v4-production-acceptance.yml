name: SSQ V4-RC2.1 legacy online acceptance (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-online-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy notice
        run: |
          echo "Local-First is the active execution policy."
          echo "This legacy online verification is manual-only and non-blocking."
      - name: Verify frozen V4 source SHA256 manifest
        run: |
          set -euo pipefail
          cd v4_rc2
          sha256sum -c SHA256SUMS.txt
          python -m py_compile *.py
