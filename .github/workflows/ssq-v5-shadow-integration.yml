name: SSQ V5 shadow integration

on:
  push:
    branches:
      - ssq-v5-shadow-integration-20261124
    paths:
      - 'ssq_v5/**'
      - '.github/workflows/ssq-v5-shadow-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v5-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install audited dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Compile V4 frozen base and V5 shadow
        run: |
          set -euo pipefail
          python -m py_compile v4_rc2/*.py ssq_v5/*.py

      - name: Verify frozen V4 base remains unchanged
        run: |
          set -euo pipefail
          cd v4_rc2
          sha256sum -c SHA256SUMS.txt

      - name: Run V5 Phase 2-4 shadow tests
        run: |
          set -euo pipefail
          cd ssq_v5
          python -m unittest test_v5_pipeline.py -v

