name: SSQ V5 Hebei full-tier evidence
on:
  push:
    branches: [ssq-v5-shadow-integration-20261124]
    paths:
      - 'ssq_v5/fetch_hebei_full_tiers.py'
      - '.github/workflows/ssq-v5-hebei-full-tiers.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -u ssq_v5/fetch_hebei_full_tiers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssq-v5-hebei-full-tier-evidence
          path: out/
          if-no-files-found: error
          retention-days: 30
