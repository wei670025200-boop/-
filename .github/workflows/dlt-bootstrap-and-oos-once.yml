name: DLT one-time approved 17500 ledger and frozen real OOS
on:
  push:
    branches: [dlt-bootstrap-oos-once-20261125]
    paths:
      - .github/workflows/dlt-bootstrap-and-oos-once.yml
      - tools/bootstrap_once/export_dlt_local_ledger.py
permissions:
  contents: write
concurrency:
  group: dlt-bootstrap-oos-once-20261125-17500
  cancel-in-progress: true
jobs:
  bootstrap-and-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:.
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      DLT_SOURCE_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Enforce independent branch and unused real-OOS claim
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/dlt-bootstrap-oos-once-20261125
          test "$GITHUB_RUN_ATTEMPT" = 1
          git fetch origin refs/heads/dlt-bootstrap-oos-once-20261125
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          test ! -e data/dlt_history.csv
          test ! -e data/dlt_real_oos_once_claim.json
          mkdir -p dlt_oos_artifacts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen numeric dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 cryptography==46.0.4
      - name: Re-run frozen Stage 1 regression and src zero-network scan
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_dlt*.py' -v 2>&1 | tee dlt_oos_artifacts/stage1_regression.log
          grep -F "Ran 163 tests" dlt_oos_artifacts/stage1_regression.log
          grep -Fx "OK" dlt_oos_artifacts/stage1_regression.log
          python audits/dlt_static_network_scan.py | tee dlt_oos_artifacts/static_scan.json
      - name: Fetch approved 17500 TXT once, hard-audit 780 rows, then export
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootstrap_once/export_dlt_local_ledger.py --audit-out dlt_oos_artifacts/source_selfcheck.json 2>&1 | tee dlt_oos_artifacts/export_selfcheck.log
      - name: Validate canonical history ledger
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 validate_dlt_history_export.py | tee dlt_oos_artifacts/data_validation.json
      - name: Commit ledger and durable once-only claim to independent branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os,json
          from pathlib import Path
          from dlt_v5.frozen_protocol import sha256,canonical_json
          from run_step2_real_oos_once import load_spec
          p=Path('data/dlt_real_oos_once_claim.json')
          claim={'schema':'DLT_REAL_OOS_ONCE_CLAIM_V1','run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':'1','csv_sha256':sha256(Path('data/dlt_history.csv').read_bytes()),'prereg_spec_sha256':sha256(load_spec()),'source_commit_sha':os.environ['DLT_SOURCE_COMMIT_SHA']}
          with p.open('xb') as f:f.write(canonical_json(claim))
          print("ONCE_CLAIM="+json.dumps(claim,sort_keys=True))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dlt_history.csv data/dlt_real_oos_once_claim.json
          git commit -m 'DLT one-time approved 17500 ledger and irreversible real-OOS claim'
          git push origin HEAD:refs/heads/dlt-bootstrap-oos-once-20261125
          git fetch origin refs/heads/dlt-bootstrap-oos-once-20261125
          test "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)"
      - name: Execute frozen real OOS exactly once
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 run_step2_real_oos_once.py 2>&1 | tee dlt_oos_artifacts/real_oos.log
      - name: Upload complete Stage2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dlt-approved-17500-stage2-evidence
          path: |
            dlt_oos_artifacts/
            data/dlt_history.csv
            data/dlt_real_oos_once_claim.json
          if-no-files-found: warn
          retention-days: 30
