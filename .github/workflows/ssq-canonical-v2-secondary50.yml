name: SSQ Canonical V2 independent secondary50
on:
  push:
    branches: [ssq-v5-shadow-integration-20261124]
    paths:
      - 'ssq_v5/data_tools/fetch_secondary50_js_cwl.py'
      - '.github/workflows/ssq-canonical-v2-secondary50.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Resolve Jiangsu official archive and fetch independent official notices
        run: python ssq_v5/data_tools/fetch_secondary50_js_cwl.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssq-canonical-v2-secondary50
          path: canonical_v2_secondary50/
          if-no-files-found: error
          retention-days: 30
