name: SSQ Sichuan archive pagination probe
on:
  push:
    branches: [ssq-v5-shadow-integration-20261124]
    paths: ['.github/workflows/ssq-sichuan-pagination-probe.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate pagination URLs
        shell: bash
        run: |
          set -u
          for u in             'https://www.scflcp.com.cn/czfl.jhtml'             'https://www.scflcp.com.cn/czfl_2.jhtml'             'https://www.scflcp.com.cn/czfl_50.jhtml'             'https://www.scflcp.com.cn/czfl_100.jhtml'             'https://www.scflcp.com.cn/czfl/2.jhtml'             'https://www.scflcp.com.cn/czfl?pageNo=2'             'https://www.scflcp.com.cn/czfl.jhtml?page=2'
          do
            code=$(curl -sS -L --compressed --connect-timeout 5 --max-time 12 -A 'Mozilla/5.0' -o /tmp/x.html -w '%{http_code}' "$u" || true)
            bytes=$(wc -c </tmp/x.html 2>/dev/null || echo 0)
            title=$(grep -oE '共[0-9]+条记录[^<]{0,30}' /tmp/x.html | head -1 || true)
            issues=$(grep -oE '20[0-9]{5}' /tmp/x.html | sort -u | head -5 | tr '\n' ',' || true)
            echo "PROBE|$code|$bytes|$u|$title|$issues"
          done
