name: SSQ R3 Guangdong history probe
on:
  push:
    branches: [ssq-r3-fetch-direct-20261122]
    paths: ['.github/workflows/ssq-r3-guangdong-history-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe legacy Guangdong official SSQ history entry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          urls=(
            "https://www.gdfc.org.cn/sjfx/tjzb8_50.html"
            "http://www.gdfc.org.cn/sjfx/tjzb8_50.html"
            "https://www.gdfc.org.cn/play_list_game_5.html"
            "http://www.gdfc.org.cn/play_list_game_5.html"
          )
          i=0
          for u in "${urls[@]}"; do
            i=$((i+1))
            for method in GET POST; do
              key="${i}_${method}"
              if [ "$method" = GET ]; then
                code=$(curl -sS -L --compressed --connect-timeout 8 --max-time 25 -A "Mozilla/5.0"                   -H "Accept: text/html,application/xhtml+xml" -H "Accept-Language: zh-CN,zh;q=0.9"                   -D "probe/${key}.headers" -o "probe/${key}.html" -w "%{http_code}" "$u" || true)
              else
                code=$(curl -sS -L --compressed --connect-timeout 8 --max-time 25 -A "Mozilla/5.0"                   -H "Content-Type: application/x-www-form-urlencoded"                   -D "probe/${key}.headers" -o "probe/${key}.html" -w "%{http_code}" -X POST --data "" "$u" || true)
              fi
              bytes=$(wc -c < "probe/${key}.html" 2>/dev/null || echo 0)
              sha=$(sha256sum "probe/${key}.html" 2>/dev/null | awk '{print $1}')
              has=$(grep -Eoc "202[456][0-9]{3}|draw_|page|下一页|上一页" "probe/${key}.html" 2>/dev/null || true)
              echo "$key|$method|$code|$bytes|$has|$sha|$u" | tee -a probe/status.txt
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssq-r3-guangdong-history-probe
          path: probe
