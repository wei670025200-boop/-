name: SSQ V5 official archive capability probe
on:
  push:
    branches: [ssq-v5-shadow-integration-20261124]
    paths:
      - 'ssq_v5/probe_archive_capabilities.py'
      - '.github/workflows/ssq-v5-archive-capability-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python ssq_v5/probe_archive_capabilities.py
