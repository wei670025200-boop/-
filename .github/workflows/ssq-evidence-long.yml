name: SSQ extended evidence fetch
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch extended official raw responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          fetch() {
            name="$1"; url="$2"
            echo "FETCH $name $url"
            if curl --fail --location --compressed --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 90 --dump-header "evidence/${name}.headers" --output "evidence/${name}.body" "$url"; then
              echo OK > "evidence/${name}.status"
            else
              code=$?; echo "FAIL:$code" > "evidence/${name}.status"; : > "evidence/${name}.body"; : > "evidence/${name}.headers"
            fi
          }
          fetch shanghai_previous_1000 'https://www.swlc.net.cn/lottery/ssq.html?limit=1000&view=previous'
          fetch shanghai_previous_page2 'https://www.swlc.net.cn/lottery/ssq.html?limit=100&view=previous&page=2'
          fetch shanghai_previous_offset100 'https://www.swlc.net.cn/lottery/ssq.html?limit=100&view=previous&offset=100'
          fetch shanghai_lskj_js 'https://appsh.swlc.net.cn/shfcoc_datachart/js/v2.0/datachart/ssq/lskj.js?v=20261119'
          fetch shanghai_datachart_common_js 'https://appsh.swlc.net.cn/shfcoc_datachart/js/v2.0/datachart/datachart_index_common.js?v=20261119'
          fetch shanghai_datechartcommon_js 'https://appsh.swlc.net.cn/shfcoc_datachart/js/v2.0/datacenter/datechartcommon.js?v=20261119'
          fetch shanghai_zdy_js 'https://appsh.swlc.net.cn/shfcoc_datachart/js/v2.0/datachart/zdy.js?v=20261119'
          fetch shanghai_procommon_js 'https://appsh.swlc.net.cn/shfcoc_datachart/js/v2.0/commtools/procommon.js?v=20261119'
          fetch shanghai_lskj_1000 'https://appsh.swlc.net.cn/shfcoc_datachart/datachart/ssq/lskj/ls_award.html?num=1000'
          fetch shanghai_lskj_date 'https://appsh.swlc.net.cn/shfcoc_datachart/datachart/ssq/lskj/ls_award.html?staDate=2021-11-19&endDate=2026-11-19'
          fetch sichuan_history_page2 'https://www.scflcp.com.cn/ssqinfo.jhtml?page=2'
          fetch sichuan_history_page3 'https://www.scflcp.com.cn/ssqinfo.jhtml?page=3'
          fetch sichuan_content_api_1000 'https://www.scflcp.com.cn/content/page?size=1000&channelIds=2565&orderBy=1'
          fetch national_cwl_1000 'https://www.cwl.gov.cn/cwl_admin/kjxx/findDrawNotice?name=ssq&issueCount=1000'
          fetch national_cwl_page1000 'https://www.cwl.gov.cn/cwl_admin/kjxx/findDrawNotice?name=ssq&pageNo=1&pageSize=1000&week=&systemType=PC'
          fetch public_500_history 'https://datachart.500.com/ssq/history/newinc/history.php?start=2021001&end=2026132'
          fetch sichuan_2024020_final4 'https://www.scflcp.com.cn/ssq/823124134.jhtml'
          fetch sichuan_2024021_final4 'https://www.scflcp.com.cn/ssq/823124195.jhtml'
          fetch sichuan_2024023_final4 'https://www.scflcp.com.cn/ssq/823124299.jhtml'
          fetch sichuan_2024027_final4 'https://www.scflcp.com.cn/ssq/823124606.jhtml'
          for i in $(seq 2 26); do fetch "sichuan_ssqinfo_${i}" "https://www.scflcp.com.cn/ssqinfo_${i}.jhtml?page=2"; done
          # China Welfare Lottery national official API requires a session cookie on some edges.
          curl --fail --location --compressed --retry 2 --connect-timeout 20 --max-time 90 -A 'Mozilla/5.0' -c evidence/cwl.cookies --dump-header evidence/cwl_home.headers --output evidence/cwl_home.body 'https://www.cwl.gov.cn/ygkj/wqkjgg/ssq/' || true
          cwl_url='https://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice?name=ssq&issueCount=1000&pageNo=1&pageSize=1000&systemType=PC'
          if curl --fail --location --compressed --retry 2 --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' -b evidence/cwl.cookies -H 'Accept: application/json' -H 'Referer: https://www.cwl.gov.cn/ygkj/wqkjgg/ssq/' --dump-header evidence/national_cwl_front_1000.headers --output evidence/national_cwl_front_1000.body "$cwl_url"; then echo OK > evidence/national_cwl_front_1000.status; else code=$?; echo "FAIL:$code" > evidence/national_cwl_front_1000.status; : > evidence/national_cwl_front_1000.body; fi
          python - <<'PY'
          import hashlib,json,datetime,pathlib,re
          root=pathlib.Path('evidence'); rows=[]; now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          for status in sorted(root.glob('*.status')):
              name=status.stem; body=root/f'{name}.body'; headers=root/f'{name}.headers'
              b=body.read_bytes(); ids=sorted(set(re.findall(rb'20\d{5}',b)))
              rows.append({'name':name,'fetched_at_utc':now,'status':status.read_text().strip(),'body_size':len(b),'body_sha256':hashlib.sha256(b).hexdigest(),'headers_sha256':hashlib.sha256(headers.read_bytes()).hexdigest(),'issue_id_count':len(ids),'min_issue':ids[0].decode() if ids else None,'max_issue':ids[-1].decode() if ids else None})
          (root/'EXTENDED_MANIFEST.json').write_text(json.dumps({'schema':'SSQ-OFFICIAL-EXTENDED-EVIDENCE-v1','records':rows},ensure_ascii=False,indent=2)+'\n')
          PY
          sha256sum evidence/* | tee evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ssq-extended-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
  final4:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch four final Sichuan 2024 official rows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final4
          cat > final4/urls.tsv <<'EOF'
          2024020 https://www.scflcp.com.cn/ssq/823124134.jhtml
          2024021 https://www.scflcp.com.cn/ssq/823124195.jhtml
          2024023 https://www.scflcp.com.cn/ssq/823124299.jhtml
          2024027 https://www.scflcp.com.cn/ssq/823124606.jhtml
          EOF
          sed -i 's/^          //' final4/urls.tsv
          while read issue url; do
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 -A 'Mozilla/5.0' -D "final4/$issue.headers" -o "final4/$issue.html" "$url"
          done < final4/urls.tsv
          python - <<'PY'
          import pathlib,re,json,hashlib,html,datetime
          out=[]
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          for p in sorted(pathlib.Path('final4').glob('2024*.html')):
              issue=p.stem; s=p.read_text(encoding='utf-8',errors='ignore')
              plain=re.sub(r'<[^>]+>',' ',html.unescape(s)); plain=re.sub(r'\s+',' ',plain)
              date=re.search(r'开奖日期[：:]\s*(20\d{2}-\d{2}-\d{2})',plain)
              sale=re.search(r'本期销售金额[：:]\s*([\d,]+)\s*元',plain)
              pool=re.search(r'下期一等奖奖池累计金额[：:]\s*([\d,]+)\s*元',plain)
              balls=re.search(r'中奖号码\s*((?:\d{1,2}\s+){6}\d{1,2})',plain)
              first=re.search(r'一等奖\s+(\d+)\s+([\d,]+)',plain)
              second=re.search(r'二等奖\s+(\d+)\s+([\d,]+)',plain)
              nums=[int(x) for x in re.findall(r'\d{1,2}',balls.group(1))] if balls else []
              hp=p.with_suffix('.headers')
              out.append({'issue':issue,'fetched_at_utc':now,'date':date.group(1) if date else None,'sales_rmb':int(sale.group(1).replace(',','')) if sale else None,'reds':sorted(nums[:6]) if len(nums)>=7 else None,'blue':nums[6] if len(nums)>=7 else None,'first_count':int(first.group(1)) if first else None,'first_money':int(first.group(2).replace(',','')) if first else None,'second_count':int(second.group(1)) if second else None,'second_money':int(second.group(2).replace(',','')) if second else None,'pool_rmb':int(pool.group(1).replace(',','')) if pool else None,'body_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'headers_sha256':hashlib.sha256(hp.read_bytes()).hexdigest()})
          pathlib.Path('final4/PARSED.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssq-r3-final4-sichuan-2024
          path: final4/
          if-no-files-found: error
          retention-days: 30

  final4_session:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch final four with Sichuan session
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final4s/probe
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/158.0.0.0 Safari/537.36'
          curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 -A "$ua" -c final4s/cookies.txt -D final4s/home.headers -o final4s/home.html 'https://www.scflcp.com.cn/ssq'
          fetch_one() {
            issue="$1"; url="$2"
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 30 -A "$ua" -b final4s/cookies.txt -c final4s/cookies.txt -e 'https://www.scflcp.com.cn/ssq' -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' -D "final4s/$issue.headers" -o "final4s/$issue.html" "$url"
            echo "$issue $(wc -c < final4s/$issue.html) $url"
          }
          fetch_one 2024020 'https://www.scflcp.com.cn/ssq/823124134.jhtml'
          fetch_one 2024021 'https://www.scflcp.com.cn/ssq/823124195.jhtml'
          fetch_one 2024027 'https://www.scflcp.com.cn/ssq/823124606.jhtml'
          export ua
          seq 823124259 823124460 | xargs -P 16 -I{} bash -c '
            id="$1"; url="https://www.scflcp.com.cn/ssq/$id.jhtml"
            curl -L -sS --connect-timeout 4 --max-time 10 -A "$ua" -b final4s/cookies.txt -e "https://www.scflcp.com.cn/ssq" -o "final4s/probe/$id.html" "$url" || true
            if [ -s "final4s/probe/$id.html" ] && grep -q "双色球" "final4s/probe/$id.html" && grep -q "第2024023期" "final4s/probe/$id.html"; then
              echo "$id|$url" >> final4s/2024023_match.txt
            else
              rm -f "final4s/probe/$id.html"
            fi
          ' _ {}
          cat final4s/2024023_match.txt || true
          id=$(head -1 final4s/2024023_match.txt | cut -d'|' -f1)
          test -n "$id"
          url="https://www.scflcp.com.cn/ssq/$id.jhtml"
          fetch_one 2024023 "$url"
          python - <<'PY'
          import pathlib,re,json,hashlib,html,datetime
          out=[]; now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          for issue in ['2024020','2024021','2024023','2024027']:
              p=pathlib.Path('final4s')/(issue+'.html'); hp=pathlib.Path('final4s')/(issue+'.headers')
              s=p.read_text(encoding='utf-8',errors='ignore'); plain=re.sub(r'<[^>]+>',' ',html.unescape(s)); plain=re.sub(r'\s+',' ',plain)
              ok=('双色球' in plain and f'第{issue}期' in plain)
              date=re.search(r'开奖日期[：:]\s*(20\d{2}-\d{2}-\d{2})',plain)
              sale=re.search(r'本期销售金额[：:]\s*([\d,]+)\s*元',plain)
              pool=re.search(r'下期一等奖奖池累计金额[：:]\s*([\d,]+)\s*元',plain)
              balls=re.search(r'中奖号码\s*((?:\d{1,2}\s+){6}\d{1,2})',plain)
              first=re.search(r'一等奖\s+(\d+)\s+([\d,]+)',plain)
              second=re.search(r'二等奖\s+(\d+)\s+([\d,]+)',plain)
              nums=[int(x) for x in re.findall(r'\d{1,2}',balls.group(1))] if balls else []
              out.append({'issue':issue,'identity_ok':ok,'fetched_at_utc':now,'date':date.group(1) if date else None,'sales_rmb':int(sale.group(1).replace(',','')) if sale else None,'reds':sorted(nums[:6]) if len(nums)>=7 else None,'blue':nums[6] if len(nums)>=7 else None,'first_count':int(first.group(1)) if first else None,'first_money':int(first.group(2).replace(',','')) if first else None,'second_count':int(second.group(1)) if second else None,'second_money':int(second.group(2).replace(',','')) if second else None,'pool_rmb':int(pool.group(1).replace(',','')) if pool else None,'body_size':p.stat().st_size,'body_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'headers_sha256':hashlib.sha256(hp.read_bytes()).hexdigest()})
          pathlib.Path('final4s/PARSED.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not all(r['identity_ok'] and r['sales_rmb'] and r['second_count'] is not None and r['body_size']>1000 for r in out): raise SystemExit('FINAL4_SESSION_VALIDATION_FAILED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ssq-r3-final4-sichuan-session
          path: final4s/
          if-no-files-found: error
          retention-days: 30
