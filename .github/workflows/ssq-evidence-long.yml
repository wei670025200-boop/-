name: SSQ extended evidence fetch
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch extended official raw responses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          fetch() {
            name="$1"; url="$2"
            echo "FETCH $name $url"
            if curl --fail --location --compressed --retry 2 --retry-delay 2 --connect-timeout 20 --max-time 90 --dump-header "evidence/${name}.headers" --output "evidence/${name}.body" "$url"; then
              echo OK > "evidence/${name}.status"
            else
              code=$?; echo "FAIL:$code" > "evidence/${name}.status"; : > "evidence/${name}.body"; : > "evidence/${name}.headers"
            fi
          }
          fetch shanghai_previous_1000 'https://www.swlc.net.cn/lottery/ssq.html?limit=1000&view=previous'
          fetch shanghai_previous_page2 'https://www.swlc.net.cn/lottery/ssq.html?limit=100&view=previous&page=2'
          fetch shanghai_previous_offset100 'https://www.swlc.net.cn/lottery/ssq.html?limit=100&view=previous&offset=100'
          fetch shanghai_lskj_js 'https://appsh.swlc.net.cn/shfcoc_datachart/js/v2.0/datachart/ssq/lskj.js?v=20261119'
          fetch shanghai_datachart_common_js 'https://appsh.swlc.net.cn/shfcoc_datachart/js/v2.0/datachart/datachart_index_common.js?v=20261119'
          fetch shanghai_datechartcommon_js 'https://appsh.swlc.net.cn/shfcoc_datachart/js/v2.0/datacenter/datechartcommon.js?v=20261119'
          fetch shanghai_zdy_js 'https://appsh.swlc.net.cn/shfcoc_datachart/js/v2.0/datachart/zdy.js?v=20261119'
          fetch shanghai_procommon_js 'https://appsh.swlc.net.cn/shfcoc_datachart/js/v2.0/commtools/procommon.js?v=20261119'
          fetch shanghai_lskj_1000 'https://appsh.swlc.net.cn/shfcoc_datachart/datachart/ssq/lskj/ls_award.html?num=1000'
          fetch shanghai_lskj_date 'https://appsh.swlc.net.cn/shfcoc_datachart/datachart/ssq/lskj/ls_award.html?staDate=2021-11-19&endDate=2026-11-19'
          fetch sichuan_history_page2 'https://www.scflcp.com.cn/ssqinfo.jhtml?page=2'
          fetch sichuan_history_page3 'https://www.scflcp.com.cn/ssqinfo.jhtml?page=3'
          fetch sichuan_content_api_1000 'https://www.scflcp.com.cn/content/page?size=1000&channelIds=2565&orderBy=1'
          fetch national_cwl_1000 'https://www.cwl.gov.cn/cwl_admin/kjxx/findDrawNotice?name=ssq&issueCount=1000'
          fetch national_cwl_page1000 'https://www.cwl.gov.cn/cwl_admin/kjxx/findDrawNotice?name=ssq&pageNo=1&pageSize=1000&week=&systemType=PC'
          fetch public_500_history 'https://datachart.500.com/ssq/history/newinc/history.php?start=2021001&end=2026132'
          fetch sichuan_2024020_final4 'https://www.scflcp.com.cn/ssq/823124134.jhtml'
          fetch sichuan_2024021_final4 'https://www.scflcp.com.cn/ssq/823124195.jhtml'
          fetch sichuan_2024023_final4 'https://www.scflcp.com.cn/ssq/823124299.jhtml'
          fetch sichuan_2024027_final4 'https://www.scflcp.com.cn/ssq/823124606.jhtml'
          for i in $(seq 2 26); do fetch "sichuan_ssqinfo_${i}" "https://www.scflcp.com.cn/ssqinfo_${i}.jhtml?page=2"; done
          # China Welfare Lottery national official API requires a session cookie on some edges.
          curl --fail --location --compressed --retry 2 --connect-timeout 20 --max-time 90 -A 'Mozilla/5.0' -c evidence/cwl.cookies --dump-header evidence/cwl_home.headers --output evidence/cwl_home.body 'https://www.cwl.gov.cn/ygkj/wqkjgg/ssq/' || true
          cwl_url='https://www.cwl.gov.cn/cwl_admin/front/cwlkj/search/kjxx/findDrawNotice?name=ssq&issueCount=1000&pageNo=1&pageSize=1000&systemType=PC'
          if curl --fail --location --compressed --retry 2 --connect-timeout 20 --max-time 120 -A 'Mozilla/5.0' -b evidence/cwl.cookies -H 'Accept: application/json' -H 'Referer: https://www.cwl.gov.cn/ygkj/wqkjgg/ssq/' --dump-header evidence/national_cwl_front_1000.headers --output evidence/national_cwl_front_1000.body "$cwl_url"; then echo OK > evidence/national_cwl_front_1000.status; else code=$?; echo "FAIL:$code" > evidence/national_cwl_front_1000.status; : > evidence/national_cwl_front_1000.body; fi
          python - <<'PY'
          import hashlib,json,datetime,pathlib,re
          root=pathlib.Path('evidence'); rows=[]; now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          for status in sorted(root.glob('*.status')):
              name=status.stem; body=root/f'{name}.body'; headers=root/f'{name}.headers'
              b=body.read_bytes(); ids=sorted(set(re.findall(rb'20\d{5}',b)))
              rows.append({'name':name,'fetched_at_utc':now,'status':status.read_text().strip(),'body_size':len(b),'body_sha256':hashlib.sha256(b).hexdigest(),'headers_sha256':hashlib.sha256(headers.read_bytes()).hexdigest(),'issue_id_count':len(ids),'min_issue':ids[0].decode() if ids else None,'max_issue':ids[-1].decode() if ids else None})
          (root/'EXTENDED_MANIFEST.json').write_text(json.dumps({'schema':'SSQ-OFFICIAL-EXTENDED-EVIDENCE-v1','records':rows},ensure_ascii=False,indent=2)+'\n')
          PY
          sha256sum evidence/* | tee evidence/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ssq-extended-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30