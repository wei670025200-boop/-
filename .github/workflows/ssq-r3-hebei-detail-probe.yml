name: SSQ R3 Hebei detail probe
on:
  push:
    branches: [ssq-r3-fetch-direct-20261122]
    paths: ['.github/workflows/ssq-r3-hebei-detail-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current SSQ detail and referenced scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe/js
          url='https://www.yzfcw.com/kjgg/ssq/872287020556357.html'
          curl -fsSL --connect-timeout 8 --max-time 25 -A 'Mozilla/5.0' -D probe/detail.headers -o probe/detail.html "$url"
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('probe/detail.html').read_text(errors='ignore')
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',s,re.I):
              if src.startswith('//'): src='https:'+src
              elif src.startswith('/'): src='https://www.yzfcw.com'+src
              elif not src.startswith('http'): src='https://www.yzfcw.com/'+src
              if src not in scripts: scripts.append(src)
          pathlib.Path('probe/scripts.txt').write_text('\n'.join(scripts)+'\n')
          print('scripts',len(scripts))
          for pat in ['2026133','select','option','kjgg/ssq','ajax','api','issue','expect','period']:
              print('\nPAT',pat)
              for m in re.finditer(pat,s,re.I):
                  print(s[max(0,m.start()-200):m.start()+500].replace('\n',' ')[:800])
                  break
          PY
          n=0
          while read -r u; do
            [ -z "$u" ] && continue
            n=$((n+1))
            curl -fsSL --connect-timeout 8 --max-time 25 -A 'Mozilla/5.0' -o "probe/js/$n.js" "$u" || true
            echo "$n|$u" >> probe/js_map.txt
          done < probe/scripts.txt
          grep -REin 'kjgg|ssq|issue|expect|period|ajax|api|select|option|contentId|catalog' probe/detail.html probe/js > probe/grep.txt || true
          sha256sum probe/detail.html probe/detail.headers probe/js/* 2>/dev/null > probe/SHA256SUMS.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: ssq-r3-hebei-detail-probe
          path: probe
